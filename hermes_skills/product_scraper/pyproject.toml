[project]
name = "hermes-product-scraper"
version = "0.3.1"
description = "Отказоустойчивый скилл извлечения данных о товарах для ИИ-агента Hermes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Усиление анти-детекта (мягкая зависимость; код работает и без неё).
stealth = [
    "playwright-stealth>=1.0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-beautifulsoup4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
